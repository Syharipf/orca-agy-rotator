<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Antigravity Accounts</title>
  <style>
    :root {
      --bg: var(--orca-background, #0c0d12);
      --fg: var(--orca-foreground, #e5e7eb);
      --muted: var(--orca-muted-foreground, #9ca3af);
      --faint: #4b5563;
      --border: var(--orca-border, #1f2430);
      --card: var(--orca-card, #12151e);
      --hover: rgba(255, 255, 255, 0.035);
      --primary: var(--orca-primary, #4f46e5);
      --primary-hover: #4338ca;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.08);
      --success-border: rgba(16, 185, 129, 0.25);
      --warning: #f59e0b;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.08);
      --danger-border: rgba(239, 68, 68, 0.25);
      --font-sans: var(--orca-font-sans, "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      --font-mono: var(--orca-font-mono, "Geist Mono", "JetBrains Mono", monospace);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--fg);
      padding: 12px;
      font-size: 11.5px;
      line-height: 1.4;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--faint); }

    /* Top Bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.1px;
      color: #fff;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      font-weight: 500;
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      padding: 1px 6px;
      border-radius: 10px;
    }
    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--success);
      animation: blink 2.5s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .topbar-actions {
      display: flex;
      gap: 6px;
    }
    .btn {
      appearance: none;
      background: #1e2230;
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 4px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.1s ease, border-color 0.1s ease;
    }
    .btn:hover {
      background: #282d3f;
      border-color: #3b4258;
    }
    .btn:active {
      transform: translateY(1px);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #252a3d;
      border-color: #3f4765;
      color: #e0e7ff;
    }
    .btn-primary:hover {
      background: #2f354d;
      border-color: #555f84;
    }
    .btn svg {
      width: 12px;
      height: 12px;
      stroke-width: 2;
    }

    /* Notification / Toast */
    .toast-banner {
      display: none;
      padding: 6px 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.3;
    }
    .toast-banner.info {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
    }
    .toast-banner.error {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #fca5a5;
    }

    /* Overview Section */
    .overview-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .overview-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .meta-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }
    .model-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d1d5db;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .session-tag {
      font-size: 10.5px;
      color: var(--muted);
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pool-stat {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }
    .pool-stat b {
      color: var(--fg);
      font-weight: 600;
    }

    /* Pool Health Line */
    .pool-line {
      height: 3px;
      width: 100%;
      background: #1b1e2a;
      border-radius: 2px;
      overflow: hidden;
      display: flex;
      margin-bottom: 10px;
    }
    .pool-segment-ready {
      background: var(--success);
      height: 100%;
      transition: width 0.3s ease;
    }
    .pool-segment-exhausted {
      background: #7f1d1d;
      height: 100%;
      transition: width 0.3s ease;
    }

    /* Active Route Banner */
    .route-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: rgba(16, 185, 129, 0.05);
      border: 1px solid var(--success-border);
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 11px;
    }
    .route-left {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #a7f3d0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .route-left b {
      color: #fff;
      font-weight: 600;
    }
    .route-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }
    .route-right {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* 4-Bucket Grid */
    .bucket-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .bucket-cell {
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 3px;
      padding: 4px 6px;
    }
    .bucket-title {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .bucket-value {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
    }

    /* Section Header */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0 6px 0;
      padding: 0 2px;
    }
    .section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    .section-count {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--faint);
    }

    /* Account List Table */
    .table-container {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      overflow: hidden;
    }
    .acc-row {
      display: grid;
      grid-template-columns: 100px 1fr 140px 75px 65px;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: background 0.1s ease;
    }
    .acc-row:last-child {
      border-bottom: none;
    }
    .acc-row:hover {
      background: var(--hover);
    }
    .acc-row.active-row {
      background: rgba(16, 185, 129, 0.035);
      border-left: 2px solid var(--success);
    }

    /* Status Pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 2px 6px;
      border-radius: 3px;
      width: fit-content;
      text-transform: uppercase;
    }
    .pill-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }
    .pill-in-use {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: #34d399;
    }
    .pill-in-use .pill-dot {
      background: #10b981;
    }
    .pill-ready {
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #94a3b8;
    }
    .pill-ready .pill-dot {
      background: #94a3b8;
    }
    .pill-exhausted {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #f87171;
    }
    .pill-exhausted .pill-dot {
      background: #ef4444;
    }

    /* Email Column */
    .acc-info {
      overflow: hidden;
    }
    .acc-email {
      font-size: 11.5px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .acc-subtext {
      font-size: 9.5px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* Meters Column */
    .meter-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .meter-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9.5px;
      color: var(--muted);
    }
    .meter-item span:first-child {
      width: 40px;
    }
    .bar-bg {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 2px;
    }
    .meter-val {
      font-family: var(--font-mono);
      font-size: 9.5px;
      width: 28px;
      text-align: right;
    }

    /* Reset Column */
    .reset-col {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      text-align: right;
    }

    /* Action Column */
    .action-col {
      text-align: right;
    }
    .btn-switch {
      padding: 2px 7px;
      font-size: 10px;
      border-radius: 3px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .btn-switch:hover {
      background: #1e2230;
      color: #fff;
      border-color: #3f4765;
    }
    .active-indicator-tag {
      font-size: 9.5px;
      color: var(--success);
      font-weight: 600;
    }

    .empty-state {
      padding: 24px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="brand-title">Antigravity Switcher</span>
      <span class="live-pill">
        <span class="live-dot"></span>
        Live
      </span>
    </div>
    <div class="topbar-actions">
      <button id="btnRefresh" class="btn" title="Muat ulang status akun">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Sync
      </button>
      <button id="btnRotate" class="btn btn-primary" title="Rotasi langsung ke akun terbaik dengan kuota kosong">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
        </svg>
        Rotate Best
      </button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="statusToast" class="toast-banner"></div>

  <!-- Active Route & Pool Summary -->
  <div class="overview-box">
    <div class="overview-row">
      <div class="meta-group">
        <span id="modelNameText" class="model-tag">Gemini Models</span>
        <span id="sessionTitleText" class="session-tag" title="Target Session">Session</span>
      </div>
      <div id="poolStatText" class="pool-stat">
        Pool: <b>0 / 0</b> (0%)
      </div>
    </div>

    <!-- 3px Pool Health Line -->
    <div class="pool-line">
      <div id="poolSegReady" class="pool-segment-ready" style="width: 0%;"></div>
      <div id="poolSegExhausted" class="pool-segment-exhausted" style="width: 0%;"></div>
    </div>

    <!-- Active Route Indicator -->
    <div class="route-banner">
      <div class="route-left">
        <span class="route-dot"></span>
        <span>Active Route: <b id="routeEmailText">—</b></span>
      </div>
      <div id="routeSessionText" class="route-right">Routing active session</div>
    </div>

    <!-- 4 Buckets Breakdown (No Emojis, Clean Engineering Typography) -->
    <div class="bucket-grid">
      <div class="bucket-cell">
        <div class="bucket-title">Gemini (5h)</div>
        <div id="bGemini5h" class="bucket-value" style="color: var(--success);">0%</div>
      </div>
      <div class="bucket-cell">
        <div class="bucket-title">Gemini (Weekly)</div>
        <div id="bGeminiWeekly" class="bucket-value" style="color: var(--success);">0%</div>
      </div>
      <div class="bucket-cell">
        <div class="bucket-title">Claude/GPT (5h)</div>
        <div id="bClaude5h" class="bucket-value" style="color: var(--success);">0%</div>
      </div>
      <div class="bucket-cell">
        <div class="bucket-title">Claude/GPT (Wk)</div>
        <div id="bClaudeWeekly" class="bucket-value" style="color: var(--success);">0%</div>
      </div>
    </div>
  </div>

  <!-- Account List Section -->
  <div class="section-head">
    <span class="section-title">Managed Accounts</span>
    <span id="accountsCountText" class="section-count">0 accounts</span>
  </div>

  <div class="table-container">
    <div id="accountsList" class="empty-state">
      Connecting to Orca host...
    </div>
  </div>

  <script>
    async function rpc(name, input) {
      const host = window.orca || globalThis.orca;
      if (!host) throw new Error('Host API Orca belum terhubung.');

      if (host.plugin && typeof host.plugin.request === 'function') {
        const res = await host.plugin.request(name, input, { timeoutMs: 15000 });
        if (res && typeof res === 'object' && 'ok' in res) {
          if (!res.ok) throw new Error(res.error?.message || 'RPC Call Failed');
          return res.value;
        }
        return res;
      }

      if (typeof host.request === 'function') {
        return host.request(name, input);
      }

      throw new Error('Host API Orca tidak memiliki method plugin.request.');
    }

    function showToast(msg, isError = false) {
      const el = document.getElementById('statusToast');
      el.textContent = msg;
      el.className = 'toast-banner ' + (isError ? 'error' : 'info');
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    function formatMinutes(tsMs) {
      if (!tsMs || isNaN(tsMs)) return '—';
      const m = Math.max(0, Math.floor((tsMs - Date.now()) / 60000));
      if (m === 0) return 'Reset now';
      if (m > 60) {
        const h = Math.floor(m / 60);
        const remM = m % 60;
        return `${h}h ${remM}m`;
      }
      return `${m}m left`;
    }

    function getMeterColor(val) {
      if (val >= 1.0) return 'var(--danger)';
      if (val >= 0.75) return 'var(--warning)';
      return 'var(--success)';
    }

    function renderDashboard(data) {
      if (!data) return;

      // 1. Model & Active Session
      const model = data.activeSession?.model || 'Gemini Models';
      document.getElementById('modelNameText').textContent = model;
      document.getElementById('sessionTitleText').textContent = data.activeSession?.title || 'Terminal Session';

      // 2. Global Health Bar
      const stats = data.globalStats || {};
      const total = stats.totalAccounts || (data.accounts ? data.accounts.length : 0);
      const avail = stats.availableAccounts || 0;
      const pct = stats.healthPercent || (total > 0 ? Math.round((avail / total) * 100) : 0);

      document.getElementById('poolStatText').innerHTML = `Pool: <b>${avail} / ${total}</b> (${pct}%)`;
      const readyWidth = total > 0 ? (avail / total) * 100 : 0;
      document.getElementById('poolSegReady').style.width = readyWidth + '%';
      document.getElementById('poolSegExhausted').style.width = (100 - readyWidth) + '%';

      // 3. Active Route Banner
      const activeAcc = data.activeAccount;
      if (activeAcc) {
        document.getElementById('routeEmailText').textContent = activeAcc.email;
        document.getElementById('routeSessionText').textContent = `Target: ${data.activeSession?.title || 'Terminal'}`;
      } else {
        document.getElementById('routeEmailText').textContent = 'No Active Account';
        document.getElementById('routeSessionText').textContent = 'Standby';
      }

      // 4. 4 Buckets Breakdown
      if (activeAcc && activeAcc.buckets && activeAcc.buckets.length >= 4) {
        const b = activeAcc.buckets;
        const setB = (id, idx) => {
          const el = document.getElementById(id);
          if (el && b[idx]) {
            const p = Math.round((b[idx].usedPercent || 0) * 100);
            el.textContent = `${p}%`;
            el.style.color = getMeterColor(b[idx].usedPercent || 0);
          }
        };
        setB('bGemini5h', 0);
        setB('bGeminiWeekly', 1);
        setB('bClaude5h', 2);
        setB('bClaudeWeekly', 3);
      } else if (activeAcc) {
        const sPct = Math.round((activeAcc.sessionUsed || 0) * 100);
        const wPct = Math.round((activeAcc.weeklyUsed || 0) * 100);
        const g5 = document.getElementById('bGemini5h');
        const gw = document.getElementById('bGeminiWeekly');
        if (g5) { g5.textContent = `${sPct}%`; g5.style.color = getMeterColor(activeAcc.sessionUsed || 0); }
        if (gw) { gw.textContent = `${wPct}%`; gw.style.color = getMeterColor(activeAcc.weeklyUsed || 0); }
      }

      // 5. Account Rows Table
      const container = document.getElementById('accountsList');
      container.innerHTML = '';

      const accounts = data.accounts || [];
      document.getElementById('accountsCountText').textContent = `${accounts.length} accounts`;

      if (accounts.length === 0) {
        container.innerHTML = '<div class="empty-state">No Antigravity accounts configured in Orca.</div>';
        return;
      }

      accounts.forEach(acc => {
        const row = document.createElement('div');
        row.className = 'acc-row' + (acc.isActive ? ' active-row' : '');

        let statusHtml = '';
        if (acc.isActive) {
          statusHtml = '<span class="status-pill pill-in-use"><span class="pill-dot"></span>In Use</span>';
        } else if (acc.isExhausted) {
          statusHtml = '<span class="status-pill pill-exhausted"><span class="pill-dot"></span>Limited</span>';
        } else {
          statusHtml = '<span class="status-pill pill-ready"><span class="pill-dot"></span>Standby</span>';
        }

        const sessionPct = Math.round((acc.sessionUsed || 0) * 100);
        const weeklyPct = Math.round((acc.weeklyUsed || 0) * 100);
        const sColor = getMeterColor(acc.sessionUsed || 0);
        const wColor = getMeterColor(acc.weeklyUsed || 0);

        const subtext = acc.isActive
          ? `<div class="acc-subtext" style="color: #34d399;">Routing active traffic</div>`
          : `<div class="acc-subtext">${acc.id.substring(0, 8)}</div>`;

        const actionHtml = acc.isActive
          ? '<span class="active-indicator-tag">Active</span>'
          : `<button class="btn-switch btn-select" data-email="${acc.email}">Select</button>`;

        row.innerHTML = `
          <div>${statusHtml}</div>
          <div class="acc-info">
            <div class="acc-email" title="${acc.email}">${acc.email}</div>
            ${subtext}
          </div>
          <div class="meter-block">
            <div class="meter-item">
              <span>Session</span>
              <div class="bar-bg"><div class="bar-fill" style="width: ${Math.min(100, sessionPct)}%; background: ${sColor};"></div></div>
              <span class="meter-val" style="color: ${sColor};">${sessionPct}%</span>
            </div>
            <div class="meter-item">
              <span>Weekly</span>
              <div class="bar-bg"><div class="bar-fill" style="width: ${Math.min(100, weeklyPct)}%; background: ${wColor};"></div></div>
              <span class="meter-val" style="color: ${wColor};">${weeklyPct}%</span>
            </div>
          </div>
          <div class="reset-col" title="Earliest Reset">
            ${formatMinutes(acc.earliestReset)}
          </div>
          <div class="action-col">
            ${actionHtml}
          </div>
        `;

        container.appendChild(row);
      });

      // Bind selection buttons
      container.querySelectorAll('.btn-select').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const email = e.currentTarget.getAttribute('data-email');
          selectAccount(email, e.currentTarget);
        });
      });
    }

    async function loadData() {
      try {
        const res = await rpc('accounts.read');
        const state = (res && res.value !== undefined) ? res.value : res;
        renderDashboard(state);
      } catch (err) {
        document.getElementById('accountsList').innerHTML = `<div class="empty-state" style="color:var(--danger)">Failed to load: ${err.message}</div>`;
      }
    }

    async function selectAccount(email, buttonEl = null) {
      if (buttonEl) buttonEl.disabled = true;
      try {
        showToast(`Switching to ${email}...`);
        await rpc('accounts.selectTarget', { target: email });
        showToast(`Switched to ${email}`);
        await loadData();
      } catch (err) {
        showToast(`Switch error: ${err.message}`, true);
      } finally {
        if (buttonEl) buttonEl.disabled = false;
      }
    }

    document.getElementById('btnRefresh').addEventListener('click', (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      loadData().finally(() => { setTimeout(() => { btn.disabled = false; }, 400); });
    });

    document.getElementById('btnRotate').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Rotating...';
      try {
        showToast('Selecting best account with lowest quota...');
        const res = await rpc('accounts.rotateNow');
        const result = (res && res.value !== undefined) ? res.value : res;
        if (result && result.success) {
          showToast(`Switched to ${result.newEmail}`);
        } else {
          showToast(`Rotation skipped: ${result?.reason || 'All accounts exhausted'}`, true);
        }
        await loadData();
      } catch (err) {
        showToast(`Error: ${err.message}`, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });

    // Real-time Event Subscription from Worker
    function setupRealtimeListener() {
      const host = window.orca || globalThis.orca;
      if (host && host.plugin && typeof host.plugin.on === 'function') {
        host.plugin.on('accounts.changed', (payload) => {
          const data = (payload && payload.value !== undefined) ? payload.value : payload;
          renderDashboard(data);
        });
      }
    }

    // Auto-init with retry for frame injection
    let attempts = 0;
    function tryInit() {
      if (window.orca || globalThis.orca || attempts > 10) {
        setupRealtimeListener();
        loadData();
      } else {
        attempts++;
        setTimeout(tryInit, 200);
      }
    }
    tryInit();

    // Fast polling fallback (every 3.5s for real-time responsiveness)
    setInterval(loadData, 3500);
  </script>
</body>
</html>
