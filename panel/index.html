<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Antigravity Accounts</title>
  <style>
    :root {
      --bg: var(--orca-background, #0c0d12);
      --fg: var(--orca-foreground, #e5e7eb);
      --muted: var(--orca-muted-foreground, #9ca3af);
      --faint: #4b5563;
      --border: var(--orca-border, #1f2430);
      --card: var(--orca-card, #12151e);
      --hover: rgba(255, 255, 255, 0.035);
      --primary: var(--orca-primary, #4f46e5);
      --primary-hover: #4338ca;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.08);
      --success-border: rgba(16, 185, 129, 0.25);
      --warning: #f59e0b;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.08);
      --danger-border: rgba(239, 68, 68, 0.25);
      --font-sans: var(--orca-font-sans, "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      --font-mono: var(--orca-font-mono, "Geist Mono", "JetBrains Mono", monospace);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--fg);
      padding: 10px;
      font-size: 11.5px;
      line-height: 1.4;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      container-type: inline-size;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--faint); }

    /* Top Bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .brand-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.1px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      font-weight: 500;
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      padding: 1px 5px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--success);
      animation: blink 2.5s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .topbar-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .btn {
      appearance: none;
      background: #1e2230;
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.1s ease, border-color 0.1s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background: #282d3f;
      border-color: #3b4258;
    }
    .btn:active {
      transform: translateY(1px);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #252a3d;
      border-color: #3f4765;
      color: #e0e7ff;
    }
    .btn-primary:hover {
      background: #2f354d;
      border-color: #555f84;
    }
    .btn svg {
      width: 11px;
      height: 11px;
      stroke-width: 2;
    }

    /* Notification / Toast */
    .toast-banner {
      display: none;
      padding: 6px 9px;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 10.5px;
      line-height: 1.3;
      word-break: break-word;
    }
    .toast-banner.info {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
    }
    .toast-banner.error {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #fca5a5;
    }

    /* Overview Section */
    .overview-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 10px;
      margin-bottom: 10px;
    }
    .overview-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .meta-group {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .model-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d1d5db;
      padding: 1.5px 5px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    .session-tag {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 130px;
    }
    .pool-stat {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pool-stat b {
      color: var(--fg);
      font-weight: 600;
    }

    /* Pool Health Line */
    .pool-line {
      height: 3px;
      width: 100%;
      background: #1b1e2a;
      border-radius: 2px;
      overflow: hidden;
      display: flex;
      margin-bottom: 8px;
    }
    .pool-segment-ready {
      background: var(--success);
      height: 100%;
      transition: width 0.3s ease;
    }
    .pool-segment-exhausted {
      background: #7f1d1d;
      height: 100%;
      transition: width 0.3s ease;
    }

    /* Active Route Banner */
    .route-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
      padding: 5px 7px;
      background: rgba(16, 185, 129, 0.05);
      border: 1px solid var(--success-border);
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 10.5px;
    }
    .route-left {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #a7f3d0;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }
    .route-left span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .route-left b {
      color: #fff;
      font-weight: 600;
    }
    .route-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }
    .route-right {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 4-Bucket Grid (Responsive Auto-Fit) */
    .bucket-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 5px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .bucket-cell {
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 3px;
      padding: 3px 5px;
      min-width: 0;
    }
    .bucket-title {
      font-size: 8.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 1px;
    }
    .bucket-value {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
    }

    /* Section Header */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 6px 0;
      padding: 0 1px;
    }
    .section-title {
      font-size: 9.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    .section-count {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--faint);
    }

    /* Account List Table / Responsive Cards */
    .accounts-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .acc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 9px;
      transition: background 0.1s ease, border-color 0.1s ease;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .acc-card:hover {
      background: var(--hover);
      border-color: rgba(255, 255, 255, 0.1);
    }
    .acc-card.active-card {
      background: rgba(16, 185, 129, 0.035);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    /* Row 1: Status Pill, Email, and Action Button */
    .acc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .acc-identity {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 1.5px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .pill-dot {
      width: 4.5px;
      height: 4.5px;
      border-radius: 50%;
    }
    .pill-in-use {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: #34d399;
    }
    .pill-in-use .pill-dot {
      background: #10b981;
    }
    .pill-ready {
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #94a3b8;
    }
    .pill-ready .pill-dot {
      background: #94a3b8;
    }
    .pill-exhausted {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #f87171;
    }
    .pill-exhausted .pill-dot {
      background: #ef4444;
    }

    .acc-email {
      font-size: 11px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1 1 auto;
    }
    .acc-actions {
      flex-shrink: 0;
    }
    .btn-switch {
      padding: 2px 7px;
      font-size: 9.5px;
      border-radius: 3px;
      background: #1e2230;
      border: 1px solid var(--border);
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.1s ease;
      white-space: nowrap;
    }
    .btn-switch:hover {
      background: #282d3f;
      color: #fff;
      border-color: #3f4765;
    }
    .active-tag {
      font-size: 9px;
      color: var(--success);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* Subline if active */
    .acc-routing-note {
      font-size: 9.5px;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Row 2: Meters & Reset Time (Adaptive Flex) */
    .acc-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 3px;
      border-top: 1px solid rgba(255, 255, 255, 0.035);
    }
    .meters-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 160px;
      min-width: 0;
    }
    .meter-unit {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      color: var(--muted);
      flex: 1 1 auto;
      min-width: 70px;
    }
    .meter-unit span:first-child {
      font-size: 8.5px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .bar-bg {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      min-width: 20px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 2px;
    }
    .meter-val {
      font-family: var(--font-mono);
      font-size: 9px;
      width: 24px;
      text-align: right;
      flex-shrink: 0;
    }

    .reset-info {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .empty-state {
      padding: 20px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      border: 1px dashed var(--border);
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="brand-title">Antigravity Switcher</span>
      <span class="live-pill">
        <span class="live-dot"></span>
        Live
      </span>
    </div>
    <div class="topbar-actions">
      <button id="btnRefresh" class="btn" title="Muat ulang status akun">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Sync
      </button>
      <button id="btnRotate" class="btn btn-primary" title="Rotasi langsung ke akun terbaik dengan kuota kosong">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
        </svg>
        Rotate Best
      </button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="statusToast" class="toast-banner"></div>

  <!-- Active Route & Pool Summary -->
  <div class="overview-box">
    <div class="overview-row">
      <div class="meta-group">
        <span id="modelNameText" class="model-tag" title="Detected Model">Gemini Models</span>
        <span id="sessionTitleText" class="session-tag" title="Target Session">Session</span>
      </div>
      <div id="poolStatText" class="pool-stat">
        Pool: <b>0 / 0</b> (0%)
      </div>
    </div>

    <!-- 3px Pool Health Line -->
    <div class="pool-line">
      <div id="poolSegReady" class="pool-segment-ready" style="width: 0%;"></div>
      <div id="poolSegExhausted" class="pool-segment-exhausted" style="width: 0%;"></div>
    </div>

    <!-- Active Route Indicator -->
    <div class="route-banner">
      <div class="route-left">
        <span class="route-dot"></span>
        <span>Route: <b id="routeEmailText">—</b></span>
      </div>
      <div id="routeSessionText" class="route-right">Routing active</div>
    </div>

    <!-- Dynamic Buckets Breakdown (Gemini, Claude, GPT, Argon, Carbon, etc.) -->
    <div id="bucketGrid" class="bucket-grid"></div>
  </div>

  <!-- Account List Section -->
  <div class="section-head">
    <span class="section-title">Managed Accounts</span>
    <span id="accountsCountText" class="section-count">0 accounts</span>
  </div>

  <div id="accountsList" class="accounts-wrapper">
    <div class="empty-state">
      Connecting to Orca host...
    </div>
  </div>

  <script>
    async function rpc(name, input) {
      const host = window.orca || globalThis.orca;
      if (!host) throw new Error('Host API Orca belum terhubung.');

      if (host.plugin && typeof host.plugin.request === 'function') {
        const res = await host.plugin.request(name, input, { timeoutMs: 15000 });
        if (res && typeof res === 'object' && 'ok' in res) {
          if (!res.ok) throw new Error(res.error?.message || 'RPC Call Failed');
          return res.value;
        }
        return res;
      }

      if (typeof host.request === 'function') {
        return host.request(name, input);
      }

      throw new Error('Host API Orca tidak memiliki method plugin.request.');
    }

    function showToast(msg, isError = false) {
      const el = document.getElementById('statusToast');
      el.textContent = msg;
      el.className = 'toast-banner ' + (isError ? 'error' : 'info');
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    function formatMinutes(tsMs) {
      if (!tsMs || isNaN(tsMs)) return '—';
      const m = Math.max(0, Math.floor((tsMs - Date.now()) / 60000));
      if (m === 0) return 'Reset now';
      if (m > 60) {
        const h = Math.floor(m / 60);
        const remM = m % 60;
        return `${h}h ${remM}m`;
      }
      return `${m}m left`;
    }

    function getMeterColor(val) {
      if (val >= 100) return 'var(--danger)';
      if (val >= 80) return 'var(--warning)';
      return 'var(--success)';
    }

    function renderDashboard(data) {
      if (!data) return;

      // 1. Model & Active Session
      const model = data.activeSession?.model || 'Gemini Models';
      document.getElementById('modelNameText').textContent = model;
      document.getElementById('sessionTitleText').textContent = data.activeSession?.title || 'Terminal Session';

      // 2. Global Health Bar
      const stats = data.globalStats || {};
      const total = stats.totalAccounts || (data.accounts ? data.accounts.length : 0);
      const avail = stats.availableAccounts || 0;
      const pct = stats.healthPercent || (total > 0 ? Math.round((avail / total) * 100) : 0);

      document.getElementById('poolStatText').innerHTML = `Pool: <b>${avail} / ${total}</b> (${pct}%)`;
      const readyWidth = total > 0 ? (avail / total) * 100 : 0;
      document.getElementById('poolSegReady').style.width = readyWidth + '%';
      document.getElementById('poolSegExhausted').style.width = (100 - readyWidth) + '%';

      // 3. Active Route Banner
      const activeAcc = data.activeAccount;
      if (activeAcc) {
        document.getElementById('routeEmailText').textContent = activeAcc.email;
        document.getElementById('routeSessionText').textContent = data.activeSession?.title || 'Terminal 1';
      } else {
        document.getElementById('routeEmailText').textContent = 'No Active Account';
        document.getElementById('routeSessionText').textContent = 'Standby';
      }

      // 4. Dynamic Buckets Breakdown (Gemini, Claude, GPT, Argon, Carbon, etc.)
      const grid = document.getElementById('bucketGrid');
      grid.innerHTML = '';
      if (activeAcc && activeAcc.buckets && activeAcc.buckets.length > 0) {
        activeAcc.buckets.forEach(b => {
          const rawName = b.name || b.windowName || 'Model';
          let shortTitle = rawName
            .replace(/·\s*(?:Weekly\s*Limit\s*Remaining|Five\s*Hour\s*Limit\s*Remaining|Limit\s*Remaining)/i, '')
            .replace(/Models?/i, '')
            .trim();
          if (rawName.toLowerCase().includes('five') || rawName.toLowerCase().includes('5h')) {
            shortTitle += ' (5h)';
          } else if (rawName.toLowerCase().includes('week')) {
            shortTitle += ' (Wk)';
          }

          const p = Math.min(100, Math.round(b.usedPercent || 0));
          const color = getMeterColor(b.usedPercent || 0);

          const cell = document.createElement('div');
          cell.className = 'bucket-cell';
          cell.title = `${rawName}: ${p}% used`;
          cell.innerHTML = `
            <div class="bucket-title">${shortTitle}</div>
            <div class="bucket-value" style="color: ${color};">${p}%</div>
          `;
          grid.appendChild(cell);
        });
      } else if (activeAcc) {
        const sPct = Math.min(100, Math.round(activeAcc.sessionUsed || 0));
        const wPct = Math.min(100, Math.round(activeAcc.weeklyUsed || 0));
        grid.innerHTML = `
          <div class="bucket-cell"><div class="bucket-title">Session (5h)</div><div class="bucket-value" style="color:${getMeterColor(activeAcc.sessionUsed || 0)}">${sPct}%</div></div>
          <div class="bucket-cell"><div class="bucket-title">Weekly</div><div class="bucket-value" style="color:${getMeterColor(activeAcc.weeklyUsed || 0)}">${wPct}%</div></div>
        `;
      }

      // 5. Responsive Account Cards
      const container = document.getElementById('accountsList');
      container.innerHTML = '';

      const accounts = data.accounts || [];
      document.getElementById('accountsCountText').textContent = `${accounts.length} accounts`;

      if (accounts.length === 0) {
        container.innerHTML = '<div class="empty-state">No Antigravity accounts configured in Orca.</div>';
        return;
      }

      accounts.forEach(acc => {
        const card = document.createElement('div');
        card.className = 'acc-card' + (acc.isActive ? ' active-card' : '');

        let statusHtml = '';
        if (acc.isActive) {
          statusHtml = '<span class="status-pill pill-in-use"><span class="pill-dot"></span>In Use</span>';
        } else if (acc.isExhausted) {
          statusHtml = '<span class="status-pill pill-exhausted"><span class="pill-dot"></span>Limited</span>';
        } else {
          statusHtml = '<span class="status-pill pill-ready"><span class="pill-dot"></span>Standby</span>';
        }

        const sessionPct = Math.min(100, Math.round(acc.sessionUsed || 0));
        const weeklyPct = Math.min(100, Math.round(acc.weeklyUsed || 0));
        const sColor = getMeterColor(acc.sessionUsed || 0);
        const wColor = getMeterColor(acc.weeklyUsed || 0);

        const routingSubline = acc.isActive
          ? `<div class="acc-routing-note"><span>↳</span> Routing traffic to active session</div>`
          : '';

        const actionHtml = acc.isActive
          ? '<span class="active-tag">Active</span>'
          : `<button class="btn-switch btn-select" data-email="${acc.email}">Select</button>`;

        card.innerHTML = `
          <div class="acc-header">
            <div class="acc-identity">
              ${statusHtml}
              <span class="acc-email" title="${acc.email}">${acc.email}</span>
            </div>
            <div class="acc-actions">
              ${actionHtml}
            </div>
          </div>

          ${routingSubline}

          <div class="acc-metrics">
            <div class="meters-group">
              <div class="meter-unit">
                <span>Ses</span>
                <div class="bar-bg"><div class="bar-fill" style="width: ${sessionPct}%; background: ${sColor};"></div></div>
                <span class="meter-val" style="color: ${sColor};">${sessionPct}%</span>
              </div>
              <div class="meter-unit">
                <span>Wk</span>
                <div class="bar-bg"><div class="bar-fill" style="width: ${weeklyPct}%; background: ${wColor};"></div></div>
                <span class="meter-val" style="color: ${wColor};">${weeklyPct}%</span>
              </div>
            </div>
            <div class="reset-info" title="Earliest Reset">
              Reset: ${formatMinutes(acc.earliestReset)}
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      // Bind selection buttons
      container.querySelectorAll('.btn-select').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const email = e.currentTarget.getAttribute('data-email');
          selectAccount(email, e.currentTarget);
        });
      });
    }

    async function loadData() {
      try {
        const res = await rpc('accounts.read');
        const state = (res && res.value !== undefined) ? res.value : res;
        renderDashboard(state);
      } catch (err) {
        document.getElementById('accountsList').innerHTML = `<div class="empty-state" style="color:var(--danger)">Failed to load: ${err.message}</div>`;
      }
    }

    async function selectAccount(email, buttonEl = null) {
      if (buttonEl) buttonEl.disabled = true;
      try {
        showToast(`Switching to ${email}...`);
        await rpc('accounts.selectTarget', { target: email });
        showToast(`Switched to ${email}`);
        await loadData();
      } catch (err) {
        showToast(`Switch error: ${err.message}`, true);
      } finally {
        if (buttonEl) buttonEl.disabled = false;
      }
    }

    document.getElementById('btnRefresh').addEventListener('click', (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      loadData().finally(() => { setTimeout(() => { btn.disabled = false; }, 400); });
    });

    document.getElementById('btnRotate').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Rotating...';
      try {
        showToast('Selecting best account with lowest quota...');
        const res = await rpc('accounts.rotateNow');
        const result = (res && res.value !== undefined) ? res.value : res;
        if (result && result.success) {
          showToast(`Switched to ${result.newEmail}`);
        } else {
          showToast(`Rotation skipped: ${result?.reason || 'All accounts exhausted'}`, true);
        }
        await loadData();
      } catch (err) {
        showToast(`Error: ${err.message}`, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });

    // Real-time Event Subscription from Worker
    function setupRealtimeListener() {
      const host = window.orca || globalThis.orca;
      if (host && host.plugin && typeof host.plugin.on === 'function') {
        host.plugin.on('accounts.changed', (payload) => {
          const data = (payload && payload.value !== undefined) ? payload.value : payload;
          renderDashboard(data);
        });
      }
    }

    // Auto-init with retry for frame injection
    let attempts = 0;
    function tryInit() {
      if (window.orca || globalThis.orca || attempts > 10) {
        setupRealtimeListener();
        loadData();
      } else {
        attempts++;
        setTimeout(tryInit, 200);
      }
    }
    tryInit();

    // Fast polling fallback (every 3.5s for real-time responsiveness)
    setInterval(loadData, 3500);
  </script>
</body>
</html>
