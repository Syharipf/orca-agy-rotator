<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <!-- Deep Obsidian Canvas -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Subtle Radial Glows for Depth -->
    <radialGradient id="meshEmerald" cx="480" cy="80" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshCyan" cx="780" cy="450" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardSurface" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Active Route Glow -->
    <linearGradient id="activeGlow" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Icon Vector Gradients -->
    <linearGradient id="orbitGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="orbitBlue" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Ultra-Clean Grid Pattern -->
    <pattern id="subtleGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <style>
    .font-brand { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif; font-weight: 700; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif; }
    .font-code { font-family: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, monospace; }
  </style>

  <!-- Background Layer -->
  <rect width="960" height="600" fill="url(#bgGrad)"/>
  <rect width="960" height="600" fill="url(#subtleGrid)"/>
  <circle cx="480" cy="80" r="450" fill="url(#meshEmerald)"/>
  <circle cx="780" cy="450" r="350" fill="url(#meshCyan)"/>

  <!-- ================= TOP HEADER: BRANDING & HEADLINE ================= -->
  <g transform="translate(80, 48)">
    <!-- Brand Icon (64x64) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="64" height="64" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
      <g transform="translate(8, 8) scale(0.375)">
        <path d="M 58 29 A 35 35 0 0 1 97 58 A 35 35 0 0 1 90 80" fill="none" stroke="url(#orbitGreen)" stroke-width="6" stroke-linecap="round"/>
        <polyline points="96,66 91,81 76,77" fill="none" stroke="url(#orbitGreen)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 70 99 A 35 35 0 0 1 31 70 A 35 35 0 0 1 38 48" fill="none" stroke="url(#orbitBlue)" stroke-width="6" stroke-linecap="round"/>
        <polyline points="32,62 37,47 52,51" fill="none" stroke="url(#orbitBlue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="49,71 64,46 79,71" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="64" cy="74" r="4.5" fill="#34d399"/>
      </g>
    </g>

    <!-- Header Text Block -->
    <g transform="translate(84, 0)">
      <!-- Top Pill -->
      <g transform="translate(0, 2)">
        <rect x="0" y="0" width="158" height="20" rx="10" fill="#064e3b" fill-opacity="0.35" stroke="#059669" stroke-opacity="0.8" stroke-width="1"/>
        <circle cx="10" cy="10" r="3" fill="#34d399"/>
        <text x="20" y="14" class="font-sans" font-size="10.5" font-weight="600" fill="#a7f3d0">Official Orca ADE Plugin</text>
      </g>

      <!-- Main Title -->
      <text x="0" y="44" class="font-brand" font-size="28" fill="#ffffff" letter-spacing="-0.5">Antigravity Auto-Switcher</text>
      
      <!-- Subtitle -->
      <text x="0" y="64" class="font-sans" font-size="13.5" font-weight="400" fill="#94a3b8">
        Automated quota failover and zero-downtime account rotation for autonomous agent workflows
      </text>
    </g>
  </g>

  <!-- ================= CENTER SHOWCASE: HERO GATEWAY CARD ================= -->
  <!-- Clean, Spacious, High-End IDE Window (800 x 300) -->
  <g transform="translate(80, 148)">
    <!-- Outer Card Box -->
    <rect x="0" y="0" width="800" height="300" rx="12" fill="url(#cardSurface)" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <g transform="translate(0, 0)">
      <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 788 0 C 794.63 0 800 5.37 800 12 L 800 40 L 0 40 Z" fill="#0d131f"/>
      <line x1="0" y1="40" x2="800" y2="40" stroke="#1e293b" stroke-width="1"/>

      <!-- Window Dots -->
      <circle cx="20" cy="20" r="5" fill="#ef4444" fill-opacity="0.75"/>
      <circle cx="36" cy="20" r="5" fill="#f59e0b" fill-opacity="0.75"/>
      <circle cx="52" cy="20" r="5" fill="#10b981" fill-opacity="0.75"/>

      <!-- Window Title -->
      <text x="76" y="24" class="font-code" font-size="12" fill="#64748b">rotator@orca-host: ~/projects/antigravity-rotator (live gateway)</text>

      <!-- Right Pill Status -->
      <g transform="translate(680, 10)">
        <rect x="0" y="0" width="100" height="20" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1"/>
        <circle cx="10" cy="10" r="3" fill="#34d399"/>
        <text x="20" y="14" class="font-code" font-size="10" font-weight="600" fill="#34d399">ROUTING LIVE</text>
      </g>
    </g>

    <!-- Gateway Metadata Strip -->
    <g transform="translate(24, 52)">
      <text x="0" y="14" class="font-code" font-size="11" fill="#94a3b8">ACTIVE MODEL: <tspan fill="#f8fafc" font-weight="600">Gemini 2.5 Pro / Claude 3.7</tspan></text>
      <text x="320" y="14" class="font-code" font-size="11" fill="#94a3b8">SESSION TARGET: <tspan fill="#f8fafc" font-weight="600">Terminal 1 (PTY)</tspan></text>
      <text x="610" y="14" class="font-code" font-size="11" fill="#94a3b8">POOL HEALTH: <tspan fill="#34d399" font-weight="600">5 / 6 Ready (83%)</tspan></text>
      <line x1="0" y1="26" x2="752" y2="26" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Table Header -->
    <g transform="translate(24, 94)">
      <text x="0" y="12" class="font-code" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="0.5">STATUS</text>
      <text x="140" y="12" class="font-code" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="0.5">ACCOUNT IDENTIFIER</text>
      <text x="440" y="12" class="font-code" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="0.5">SESSION QUOTA</text>
      <text x="560" y="12" class="font-code" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="0.5">WEEKLY QUOTA</text>
      <text x="670" y="12" class="font-code" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="0.5">NEXT RESET</text>
    </g>

    <!-- Row 1: IN USE ACCOUNT (Hero Row) -->
    <g transform="translate(18, 118)">
      <rect x="0" y="0" width="764" height="52" rx="6" fill="url(#activeGlow)" stroke="#059669" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="16" cy="18" r="4.5" fill="#10b981"/>
      <text x="28" y="22" class="font-code" font-size="11.5" font-weight="700" fill="#34d399">IN USE</text>

      <text x="146" y="22" class="font-code" font-size="12" font-weight="600" fill="#ffffff">dev-lead@example.com</text>
      
      <!-- Session Bar -->
      <g transform="translate(446, 12)">
        <text x="0" y="10" class="font-code" font-size="11" font-weight="700" fill="#34d399">0%</text>
        <rect x="28" y="4" width="60" height="4" rx="2" fill="#1e293b"/>
      </g>

      <!-- Weekly Bar -->
      <g transform="translate(566, 12)">
        <text x="0" y="10" class="font-code" font-size="11" font-weight="600" fill="#a7f3d0">0%</text>
        <rect x="28" y="4" width="60" height="4" rx="2" fill="#1e293b"/>
      </g>

      <text x="676" y="22" class="font-code" font-size="11" fill="#94a3b8">2h 45m</text>

      <!-- Subline Injection Prompt -->
      <text x="28" y="40" class="font-code" font-size="10.5" fill="#6ee7b7">
        ↳ Active route connected · Auto-resume trigger armed: "lanjutkan pengerjaan tadi"
      </text>
    </g>

    <!-- Row 2: STANDBY ACCOUNT -->
    <g transform="translate(18, 178)">
      <circle cx="16" cy="14" r="3.5" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="28" y="18" class="font-code" font-size="11" fill="#94a3b8">READY</text>
      <text x="146" y="18" class="font-code" font-size="11.5" fill="#cbd5e1">worker-alpha@example.com</text>
      
      <g transform="translate(446, 8)">
        <text x="0" y="10" class="font-code" font-size="11" fill="#cbd5e1">27%</text>
        <rect x="28" y="4" width="60" height="4" rx="2" fill="#1e293b"/>
        <rect x="28" y="4" width="16" height="4" rx="2" fill="#10b981"/>
      </g>

      <g transform="translate(566, 8)">
        <text x="0" y="10" class="font-code" font-size="11" fill="#94a3b8">9%</text>
        <rect x="28" y="4" width="60" height="4" rx="2" fill="#1e293b"/>
        <rect x="28" y="4" width="6" height="4" rx="2" fill="#10b981"/>
      </g>

      <text x="676" y="18" class="font-code" font-size="11" fill="#64748b">2h 10m</text>
    </g>

    <!-- Row 3: EXHAUSTED ACCOUNT -->
    <g transform="translate(18, 214)">
      <circle cx="16" cy="14" r="3.5" fill="#ef4444"/>
      <text x="28" y="18" class="font-code" font-size="11" fill="#f87171">LIMIT</text>
      <text x="146" y="18" class="font-code" font-size="11.5" fill="#64748b">runner-beta@example.com</text>

      <g transform="translate(446, 8)">
        <text x="0" y="10" class="font-code" font-size="11" fill="#ef4444">100%</text>
        <rect x="36" y="4" width="52" height="4" rx="2" fill="#7f1d1d"/>
      </g>

      <g transform="translate(566, 8)">
        <text x="0" y="10" class="font-code" font-size="11" fill="#ef4444">100%</text>
        <rect x="36" y="4" width="52" height="4" rx="2" fill="#7f1d1d"/>
      </g>

      <text x="676" y="18" class="font-code" font-size="11" fill="#f87171">Reset in 18m</text>
    </g>

    <!-- Card Footer Status -->
    <g transform="translate(0, 258)">
      <rect x="0" y="0" width="800" height="42" rx="0" fill="#090d15"/>
      <line x1="0" y1="0" x2="800" y2="0" stroke="#1e293b" stroke-width="1"/>
      
      <circle cx="24" cy="21" r="3.5" fill="#10b981"/>
      <text x="36" y="25" class="font-code" font-size="11" fill="#10b981">SYSTEM OPERATIONAL</text>

      <text x="220" y="25" class="font-code" font-size="11" fill="#64748b">Cooldown: 30s</text>
      <text x="340" y="25" class="font-code" font-size="11" fill="#64748b">Keyring Settle: 2.0s</text>
      <text x="490" y="25" class="font-code" font-size="11" fill="#64748b">Circuit Breaker: 5 / 180s</text>
      <text x="670" y="25" class="font-code" font-size="11" fill="#38bdf8">Mode: Auto-Failover</text>
    </g>
  </g>

  <!-- ================= BOTTOM STRIP: 3 VALUE PILLARS ================= -->
  <!-- 3 Equal Cards (250px each, 25px gap, total 800px) -->
  <g transform="translate(80, 472)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="250" height="80" rx="8" fill="#0f1523" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="26" r="4" fill="#10b981"/>
      <text x="32" y="30" class="font-sans" font-size="13" font-weight="600" fill="#ffffff">Instant 429 Failover</text>
      <text x="20" y="54" class="font-sans" font-size="11.5" fill="#94a3b8">
        Detects rate limits in real-time and swaps active keyring credentials
      </text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(275, 0)">
      <rect x="0" y="0" width="250" height="80" rx="8" fill="#0f1523" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="26" r="4" fill="#38bdf8"/>
      <text x="32" y="30" class="font-sans" font-size="13" font-weight="600" fill="#ffffff">Terminal Auto-Resume</text>
      <text x="20" y="54" class="font-sans" font-size="11.5" fill="#94a3b8">
        Automatically injects continuation trigger to active agent PTY
      </text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="250" height="80" rx="8" fill="#0f1523" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="26" r="4" fill="#f59e0b"/>
      <text x="32" y="30" class="font-sans" font-size="13" font-weight="600" fill="#ffffff">Anti-Ban Protection</text>
      <text x="20" y="54" class="font-sans" font-size="11.5" fill="#94a3b8">
        Guards accounts with 30s cooldown and sliding-window circuit breaker
      </text>
    </g>
  </g>
</svg>
