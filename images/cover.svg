<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>

    <!-- Active Row Highlight -->
    <linearGradient id="activeRowBg" x1="0" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Emerald / Teal Active Routing Gradient -->
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Return Gradient -->
    <linearGradient id="cyanGrad" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="ambientGlow" cx="480" cy="180" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; font-weight: 700; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="600" fill="url(#bg)"/>
  <rect width="960" height="600" fill="url(#gridPattern)"/>
  <circle cx="480" cy="180" r="400" fill="url(#ambientGlow)"/>

  <!-- Top Hero Header Section -->
  <g transform="translate(90, 48)">
    <!-- Brand Icon (Exact Vector Icon 72x72) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="72" height="72" rx="18" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
      <g transform="translate(10, 10) scale(0.406)">
        <!-- Top Orbit -->
        <path d="M 58 29 A 35 35 0 0 1 97 58 A 35 35 0 0 1 90 80" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round"/>
        <polyline points="96,66 91,81 76,77" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Bottom Orbit -->
        <path d="M 70 99 A 35 35 0 0 1 31 70 A 35 35 0 0 1 38 48" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
        <polyline points="32,62 37,47 52,51" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Antigravity Chevron -->
        <polyline points="49,71 64,46 79,71" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="64" cy="74" r="4.5" fill="#34d399"/>
      </g>
    </g>

    <!-- Title and Subtitle -->
    <text x="88" y="32" class="font-title" font-size="28" fill="#ffffff" letter-spacing="-0.5">Antigravity Auto-Switcher</text>
    <text x="88" y="56" class="font-sans" font-size="14" fill="#94a3b8">Zero-downtime rate limit failover &amp; autonomous quota rotator for Orca ADE</text>

    <!-- Badges Row -->
    <g transform="translate(88, 70)">
      <!-- Badge 1: Orca Plugin v2 -->
      <rect x="0" y="0" width="132" height="22" rx="11" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1"/>
      <circle cx="10" cy="11" r="3.5" fill="#34d399"/>
      <text x="20" y="15" class="font-sans" font-size="11" font-weight="600" fill="#a7f3d0">Orca Plugin v2</text>

      <!-- Badge 2: Linux Systemd -->
      <rect x="140" y="0" width="138" height="22" rx="11" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="150" y="15" class="font-sans" font-size="11" font-weight="500" fill="#cbd5e1">Linux User Daemon</text>

      <!-- Badge 3: Settle & Auto-Resume -->
      <rect x="286" y="0" width="144" height="22" rx="11" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="296" y="15" class="font-sans" font-size="11" font-weight="500" fill="#cbd5e1">Auto-Resume Terminal</text>

      <!-- Badge 4: Circuit Breaker -->
      <rect x="438" y="0" width="136" height="22" rx="11" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="448" y="15" class="font-sans" font-size="11" font-weight="500" fill="#cbd5e1">Circuit Breaker (5/180s)</text>
    </g>
  </g>

  <!-- Center Main Window Mockup (Engineering TUI & Status Dashboard) -->
  <g transform="translate(90, 175)">
    <!-- Card Outer Box -->
    <rect x="0" y="0" width="780" height="276" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Window Header -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 768 0 C 774.63 0 780 5.37 780 12 L 780 38 L 0 38 Z" fill="#0d131f"/>
    <line x1="0" y1="38" x2="780" y2="38" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="18" cy="19" r="5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="34" cy="19" r="5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="50" cy="19" r="5" fill="#10b981" fill-opacity="0.8"/>
    <text x="70" y="23" class="font-mono" font-size="12" fill="#64748b">rotator@orca-host: ~/projects/antigravity-rotator (live monitor)</text>

    <!-- Table Header -->
    <g transform="translate(20, 52)">
      <text x="0" y="12" class="font-mono" font-size="11" font-weight="600" fill="#475569">STATUS</text>
      <text x="140" y="12" class="font-mono" font-size="11" font-weight="600" fill="#475569">ACCOUNT [PRIVACY MASK: ON]</text>
      <text x="430" y="12" class="font-mono" font-size="11" font-weight="600" fill="#475569">SESSION</text>
      <text x="520" y="12" class="font-mono" font-size="11" font-weight="600" fill="#475569">WEEKLY</text>
      <text x="610" y="12" class="font-mono" font-size="11" font-weight="600" fill="#475569">RESET IN</text>
      <line x1="0" y1="20" x2="740" y2="20" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Row 1: Active IN USE Account (dev-lead@example.com) -->
    <g transform="translate(16, 78)">
      <rect x="0" y="0" width="748" height="48" rx="6" fill="url(#activeRowBg)" stroke="#059669" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="18" r="4.5" fill="#10b981"/>
      <text x="26" y="22" class="font-mono" font-size="12" font-weight="700" fill="#34d399">IN USE</text>
      <text x="144" y="22" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc">dev-lead@example.com</text>
      <text x="434" y="22" class="font-mono" font-size="12" font-weight="700" fill="#34d399">0%</text>
      <text x="524" y="22" class="font-mono" font-size="12" font-weight="600" fill="#a7f3d0">0%</text>
      <text x="614" y="22" class="font-mono" font-size="12" fill="#94a3b8">2h 45m</text>
      <!-- Sub-line active routing details -->
      <text x="26" y="38" class="font-mono" font-size="11" fill="#6ee7b7">╰─ Routing traffic to Terminal 1 (PTY) · Auto-resume trigger ready</text>
    </g>

    <!-- Row 2: Standby Account (worker-alpha@example.com) -->
    <g transform="translate(16, 134)">
      <circle cx="16" cy="14" r="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="26" y="18" class="font-mono" font-size="12" fill="#94a3b8">READY</text>
      <text x="144" y="18" class="font-mono" font-size="12" fill="#cbd5e1">worker-alpha@example.com</text>
      <text x="434" y="18" class="font-mono" font-size="12" fill="#cbd5e1">27%</text>
      <text x="524" y="18" class="font-mono" font-size="12" fill="#94a3b8">9%</text>
      <text x="614" y="18" class="font-mono" font-size="12" fill="#64748b">2h 10m</text>
    </g>

    <!-- Row 3: Standby Account (standby-pool@example.com) -->
    <g transform="translate(16, 168)">
      <circle cx="16" cy="14" r="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="26" y="18" class="font-mono" font-size="12" fill="#94a3b8">READY</text>
      <text x="144" y="18" class="font-mono" font-size="12" fill="#cbd5e1">standby-pool@example.com</text>
      <text x="434" y="18" class="font-mono" font-size="12" fill="#34d399">0%</text>
      <text x="524" y="18" class="font-mono" font-size="12" fill="#34d399">0%</text>
      <text x="614" y="18" class="font-mono" font-size="12" fill="#64748b">4h 26m</text>
    </g>

    <!-- Row 4: Exhausted Account (runner-beta@example.com) -->
    <g transform="translate(16, 202)">
      <line x1="12" y1="10" x2="20" y2="18" stroke="#ef4444" stroke-width="1.5"/>
      <line x1="20" y1="10" x2="12" y2="18" stroke="#ef4444" stroke-width="1.5"/>
      <text x="26" y="18" class="font-mono" font-size="12" fill="#f87171">EXHAUST</text>
      <text x="144" y="18" class="font-mono" font-size="12" fill="#64748b">runner-beta@example.com</text>
      <text x="434" y="18" class="font-mono" font-size="12" fill="#ef4444">100%</text>
      <text x="524" y="18" class="font-mono" font-size="12" fill="#f87171">100%</text>
      <text x="614" y="18" class="font-mono" font-size="12" fill="#ef4444">Resets in 18m</text>
    </g>

    <!-- Card Bottom Status Bar -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="780" height="36" rx="0" fill="#080d14"/>
      <line x1="0" y1="0" x2="780" y2="0" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="23" class="font-mono" font-size="11" fill="#10b981">● SYSTEM HEALTHY</text>
      <text x="150" y="23" class="font-mono" font-size="11" fill="#64748b">Cooldown: 30s</text>
      <text x="260" y="23" class="font-mono" font-size="11" fill="#64748b">Keyring Settle: 2.0s</text>
      <text x="410" y="23" class="font-mono" font-size="11" fill="#64748b">Hotkeys: [r] Rotate Best  [m] Toggle Mask  [q] Exit</text>
    </g>
  </g>

  <!-- Bottom Metric Highlights (4 Cards) -->
  <g transform="translate(90, 475)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="180" height="72" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="28" class="font-mono" font-size="11" fill="#64748b">DETECTION</text>
    <text x="16" y="52" class="font-sans" font-size="15" font-weight="700" fill="#38bdf8">NDJSON &amp; IPC Probe</text>

    <!-- Metric 2 -->
    <rect x="200" y="0" width="180" height="72" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="28" class="font-mono" font-size="11" fill="#64748b">FAILOVER VELOCITY</text>
    <text x="16" y="52" class="font-sans" font-size="15" font-weight="700" fill="#34d399">&lt; 100ms Switch</text>

    <!-- Metric 3 -->
    <rect x="400" y="0" width="180" height="72" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="28" class="font-mono" font-size="11" fill="#64748b">ANTI-BAN GUARD</text>
    <text x="16" y="52" class="font-sans" font-size="15" font-weight="700" fill="#f59e0b">5 Swaps / 180s</text>

    <!-- Metric 4 -->
    <rect x="600" y="0" width="180" height="72" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="28" class="font-mono" font-size="11" fill="#64748b">SESSION CONTINUATION</text>
    <text x="16" y="52" class="font-sans" font-size="15" font-weight="700" fill="#a7f3d0">Zero Context Loss</text>
  </g>
</svg>
